<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Weather Monitoring System</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1><i class="fa-solid fa-cloud-sun-rain"></i> Weather Monitoring Dashboard</h1>
        <div id="connection-status" class="status-disconnected">
            <i class="fa-solid fa-circle"></i> <span>Connecting...</span>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Temperature Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-temperature-half" style="color: #ff5252;"></i> Temperature</h2>
            </div>
            <div class="card-content">
                <div class="value-display" id="temp-val">-- °C</div>
            </div>
            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </div>

        <!-- Humidity Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-droplet" style="color: #448aff;"></i> Humidity</h2>
            </div>
            <div class="card-content">
                <div class="value-display" id="hum-val">-- %</div>
            </div>
            <div class="chart-container">
                <canvas id="humChart"></canvas>
            </div>
        </div>

        <!-- Soil Moisture Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-seedling" style="color: #69f0ae;"></i> Soil Moisture</h2>
            </div>
            <div class="card-content">
                <div class="value-display" id="soil-val">--</div>
                <div class="status-indicator" id="soil-status">Waiting...</div>
            </div>
        </div>

        <!-- Rain Sensor Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-cloud-showers-heavy" style="color: #40c4ff;"></i> Rain Sensor</h2>
            </div>
            <div class="card-content">
                <div class="value-display" id="rain-val">--</div>
                <div class="status-indicator" id="rain-status">Waiting...</div>
            </div>
        </div>

        <!-- LDR Light Sensor Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-sun" style="color: #ffd740;" id="light-icon"></i> Light Level</h2>
            </div>
            <div class="card-content">
                <div class="value-display" id="light-val">--</div>
                <div class="status-indicator" id="light-status">Waiting...</div>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
</body>

</html>
